name: Compila Ecojumbo (iOS)

on:
  push:
    branches: [ main, master ]
    # No CI loop on automatic history updates or documentation-only commits.
    paths-ignore:
      - 'BUILD_HISTORY.md'
      - 'STATO_PROGETTO.md'
      - 'AGENTS.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test sorgenti + build simulatore
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - name: Scarica i sorgenti del repository
        uses: actions/checkout@v4

      - name: Mostra versione Xcode disponibile
        run: |
          xcodebuild -version
          xcodebuild -list -project Ecojumbo.xcodeproj

      - name: Controlli strutturali Python
        run: |
          set -euo pipefail
          failed=0
          for f in Tests/verify_version.py Tests/verify_package.py Tests/verify_source_references.py; do
            if ! python3 "$f"; then
              echo "::error file=$f::Regressione fallita in $f"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then exit 1; fi
          plutil -lint Ecojumbo.xcodeproj/project.pbxproj
          plutil -lint Ecojumbo/Info.plist

      - name: Test protocollo JK Bluetooth (sola lettura)
        run: |
          set -euo pipefail
          swiftc Ecojumbo/Models/JKProtocol.swift Tests/JKProtocolTests.swift -o "$RUNNER_TEMP/jk_tests"
          "$RUNNER_TEMP/jk_tests"

      - name: Test barre dinamiche
        run: |
          set -euo pipefail
          swiftc Ecojumbo/Models/CockpitBarMath.swift Tests/CockpitBarMathTests.swift -o "$RUNNER_TEMP/bar_tests"
          "$RUNNER_TEMP/bar_tests"

      - name: Test inclinometro fisico (gravita' e assi auto)
        run: |
          set -euo pipefail
          swiftc Ecojumbo/Models/VehicleInclinationMath.swift Tests/VehicleInclinationMathTests.swift -o "$RUNNER_TEMP/inclinometer_tests"
          "$RUNNER_TEMP/inclinometer_tests"

      - name: Compila app per simulatore iOS (senza firma Apple)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Ecojumbo.xcodeproj \
            -scheme Ecojumbo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/EcojumboDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compila Release per iPhone (senza firma Apple)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Ecojumbo.xcodeproj \
            -scheme Ecojumbo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/EcojumboReleaseData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archivia log diagnostici in caso di errore
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/ecojumbo-diagnostic"
          xcodebuild -version > "$RUNNER_TEMP/ecojumbo-diagnostic/xcode-version.txt" 2>&1 || true
          xcodebuild -list -project Ecojumbo.xcodeproj > "$RUNNER_TEMP/ecojumbo-diagnostic/schemes.txt" 2>&1 || true

      - name: Allega diagnostica di Xcode
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecojumbo-diagnostica-xcode
          path: ${{ runner.temp }}/ecojumbo-diagnostic/
          if-no-files-found: ignore
