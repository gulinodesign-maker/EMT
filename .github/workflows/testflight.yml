name: Pubblica Ecojumbo su TestFlight

# Avvio manuale disponibile; pubblicazione automatica solo per modifiche dell'app su main.
# Le modifiche al solo workflow o alla documentazione NON inviano nuove build.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Ecojumbo/**'
      - 'Ecojumbo.xcodeproj/**'

permissions:
  contents: read

concurrency:
  group: ecojumbo-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Firma e carica Ecojumbo
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Scarica progetto Ecojumbo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verifica configurazione Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Credenziali mancanti::Configura il secret $name in Settings > Secrets and variables > Actions"
              exit 1
            fi
          done
          echo "Credenziali presenti (contenuto non mostrato)."

      - name: Controlla versione e Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project Ecojumbo.xcodeproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = it.ecojumbo.battery;' Ecojumbo.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 1.0;' Ecojumbo.xcodeproj/project.pbxproj

      - name: Assegna numero progressivo a ogni build
        shell: bash
        run: |
          set -euo pipefail
          # Il numero ufficiale della build viene dal progetto Xcode.
          # Anche i retry del workflow devono conservare la build 21.
          BUILD_NUMBER="$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([0-9][0-9]*\);.*/\1/p' Ecojumbo.xcodeproj/project.pbxproj | head -1)"
          if [[ -z "$BUILD_NUMBER" || ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Numero build Xcode non valido"
            exit 1
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Numero build TestFlight: $BUILD_NUMBER"

      - name: Prepara autenticazione App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Archivia e firma per iPhone
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Ecojumbo.xcodeproj \
            -scheme Ecojumbo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ecojumbo.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Invia a TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/EcojumboExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/EcojumboExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ecojumbo.xcarchive" \
            -exportPath "$RUNNER_TEMP/EcojumboExport" \
            -exportOptionsPlist "$RUNNER_TEMP/EcojumboExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Elimina chiave temporanea
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
